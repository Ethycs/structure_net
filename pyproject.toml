[project]
authors = [{name = "Ethycs", email = "Ethycs@users.noreply.github.com"}]
name = "structure_net"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["jax[cuda12]>=0.6.0,<0.7", "ripser>=0.6.15,<0.7"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/structure_net", "src/neural_architecture_lab"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
matplotlib = "*"
numpy = "*"
pytest = "*"
tqdm = "*"
pip = "*"
ipykernel = ">=6.29.5,<7"
scipy = ">=1.16.0,<2"
scikit-learn = ">=1.7.2,<2"
pandas = ">=2.3.0,<3"
wandb = ">=0.21.0,<0.22"
seaborn = ">=0.13.2,<0.14"
pydantic = ">=2.0.0,<3"
jsonschema = ">=4.0.0,<5"
pytest-asyncio = ">=1.0.0,<2"
chromadb = ">=0.4.0,<0.5"
h5py = ">=3.14.0,<4"
jaxlib = ">=0.6.0,<0.7"
notebook = ">=7.4.4,<8"

[tool.pixi.pypi-dependencies]
structure_net = { path = ".", editable = true }
transformers = ">=4.42,<5"

[tool.pixi.activation.env]
# CUDA-enabled Python wheels bundle a mutually compatible CUDA userspace. Do
# not let a host toolkit earlier on LD_LIBRARY_PATH override individual wheel
# libraries (for example, CUDA 12.8 nvJitLink cannot satisfy a 12.9 cuSPARSE).
LD_LIBRARY_PATH = ""
CUBLAS_WORKSPACE_CONFIG = ":4096:8"

[tool.pixi.tasks]
install-torch = "pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128"
test-cuda = "python -c \"import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}')\""
cuda-selfcheck = """
python -c "import importlib.metadata as imd, subprocess, os; \
p=imd.distribution('nvidia-cusparse-cu12').locate_file('nvidia/cusparse/lib/libcusparse.so.12'); \
out=subprocess.check_output(['ldd', str(p)], text=True); \
line=next((l for l in out.splitlines() if 'libnvJitLink.so.12' in l), ''); \
print('libcusparse:', p); \
print('nvJitLink resolve:', line); \
print('LD_LIBRARY_PATH:', os.environ.get('LD_LIBRARY_PATH',''))"
"""

# NCM has its own locked CUDA runtime; run it from the repository root with
# `pixi run --locked -e ncm ...`. Never install experiment environments in data/.
[tool.pixi.environments]
ncm = { features = ["ncm"], no-default-feature = true }

[tool.pixi.feature.ncm.dependencies]
python = "==3.11.13"
pip = "*"

[tool.pixi.feature.ncm.pypi-dependencies]
torch = { version = "==2.4.1+cu121", index = "https://download.pytorch.org/whl/cu121" }
numpy = "==1.26.4"
transformers = "==4.53.3"
tokenizers = "==0.21.4"
huggingface-hub = "==0.33.1"
safetensors = "==0.8.0"
einops = "==0.8.1"
hydra-core = "==1.3.2"
omegaconf = "==2.3.0"
tiktoken = "==0.11.0"
pysbd = "==0.3.4"
requests = "==2.32.4"
pytest = "==8.4.1"

[tool.pixi.feature.ncm.activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/src:${PIXI_PROJECT_ROOT}"
PYTHONNOUSERSITE = "1"
LD_LIBRARY_PATH = ""
OMP_NUM_THREADS = "2"

[tool.pixi.feature.ncm.tasks]
# These NCM tests do not use the global network-factory/SciPy fixtures.
test-ncm = "python -m pytest --confcutdir=tests/structure_net -q tests/structure_net/test_ncm_streaming_source_features.py tests/structure_net/test_ncm_packed_sequential_objective.py tests/structure_net/test_ncm_sequential_memory.py tests/structure_net/test_ncm_sequential_development_v2.py"
ncm-check = { cmd = "python -m experiments.structure_net.ncm_pixi check", env = { CUDA_VISIBLE_DEVICES = "", HF_HUB_OFFLINE = "1" } }
ncm-pilot = { cmd = "python -m experiments.structure_net.ncm_pixi pilot", env = { CUDA_VISIBLE_DEVICES = "1", CUDA_DEVICE_ORDER = "PCI_BUS_ID", HF_HUB_OFFLINE = "1" } }
ncm-train = { cmd = "python -m experiments.structure_net.ncm_pixi train", env = { CUDA_VISIBLE_DEVICES = "1", CUDA_DEVICE_ORDER = "PCI_BUS_ID", HF_HUB_OFFLINE = "1" } }
